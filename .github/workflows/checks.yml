name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prove_failure:
        description: Run the intentionally failing assertion to verify CI failure propagation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Python syntax checks
        run: python -m compileall -q python scripts tests/python
      - name: Python fixture tests
        run: python -m pytest tests/python -q --junitxml=reports/python.xml
      - name: Controlled assertion failure
        if: ${{ inputs.prove_failure == true || github.ref_name == 'ci/assertion-proof' }}
        run: python -m pytest tests/ci/assertion_failure.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-results
          path: reports/python.xml
          retention-days: 7

  application:
    if: ${{ github.ref_name != 'ci/assertion-proof' && inputs.prove_failure != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gis_testing
          POSTGRES_USER: gis_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis_ci -d gis_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gis_testing
      DB_USERNAME: gis_ci
      DB_PASSWORD: ephemeral_ci_only
      DB_SSLMODE: prefer
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RUN_POSTGIS_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - name: Create disposable schema test database
        run: docker exec "${{ job.services.postgres.id }}" psql -U gis_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN' -c 'CREATE ROLE authenticated NOLOGIN' -c 'CREATE DATABASE gis_schema_testing TEMPLATE template0'
      - run: php vendor/bin/pint --test
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked exporter dependencies for database integration tests
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify migrations as a managed-database administrator
        run: php tests/ci/migrate_non_superuser.php
      - run: php artisan test --log-junit reports/phpunit.xml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: application-results
          path: |
            reports/phpunit.xml
            reports/reference-api.json
            reports/facility-api.json
            reports/map-statistics-api.json
            playwright-report/
            test-results/
          retention-days: 7
